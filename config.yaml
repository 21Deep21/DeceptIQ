sources:
  openphish_feed_url: https://openphish.com/feed.txt
  urlhaus_text_recent_url: https://urlhaus.abuse.ch/downloads/text_recent/
  urlhaus_text_url: https://urlhaus.abuse.ch/downloads/text/
  urlhaus_api_text_url: https://urlhaus-api.abuse.ch/v1/text/
  tranco_api_base: https://tranco-list.eu/api
  majestic_csv_url: https://downloads.majestic.com/majestic_million.csv

features:
  tfidf:
    analyzer: char
    ngram_range: [3, 5]
    min_df: 3
    max_features: 5000

explainability:
  top_k_features: 10
  shap_backend: auto
  ioc:
    long_path_chars: 100
    many_query_params: 5
    many_subdomains: 3
    many_path_segments: 5
    max_encoded_samples: 5

network:
  user_agent: "phishing-url-analyzer/0.8.0 (MCA academic research project; defensive URL analysis)"
  feed_connect_timeout: 10
  feed_read_timeout: 60
  feed_retries: 3
  feed_retry_backoff: 2.0
  max_feed_mb: 200
  tranco_poll_timeout: 120
  enrichment_timeout: 5

model:
  model_path: model/model.joblib
  metadata_path: model/metadata.json
  threshold_path: model/threshold.json
  metrics_path: model/model_metrics.csv
  notes_path: model/phase2_notes.json
  test_errors_path: model/test_errors.csv
  cv_folds: 5
  selected_model: random_forest
  calibration:
    method: sigmoid
    note: >
      Calibrator is fitted on the VALIDATION split via FrozenEstimator.
      Train and validation share no registrable domains (domain-aware
      splits), so the calibrator sees only held-out data. Raw model
      scores are NOT probabilities; only calibrated outputs are.
  threshold_policy:
    target_recall: 0.97
    min_precision: 0.90
    rule: >
      Among thresholds with recall >= target_recall AND precision >=
      min_precision: maximize recall, then precision, then choose the
      lowest threshold. If none qualifies, fall back to the F2-optimal
      threshold and report the shortfall honestly. Selected on the
      validation split ONLY; never on test.
  split:
    train_frac: 0.6
    val_frac: 0.2
    test_frac: 0.2
    note: >
      Domains are assigned to exactly one split. test.csv is FROZEN: not used
      for feature fitting, model selection, hyperparameter or threshold
      decisions; evaluated once in Phase 3 after the final model is fixed.
