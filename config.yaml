# phishing-url-analyzer configuration
# IMPORTANT: secrets must NEVER be stored here - environment variables only
# (a git-ignored .env file may supply them; see appconfig.load_env_file).

application:
  name: phishing-url-analyzer
  version: 0.8.0

server:
  host: 127.0.0.1
  port: 5000
  debug: false

paths:
  raw_data_dir: data/raw
  processed_data_dir: data/processed
  processed_dataset_file: data/processed/urls.csv
  dataset_stats_file: data/processed/dataset_stats.json
  model_dir: model
  log_dir: logs
  database_path: data/scans.db
  alert_log_path: data/alerts.log

api:
  rate_limit: "30 per minute"
  batch_limit: 50
  history_default_limit: 50
  history_max_limit: 500
  request_body_max_bytes: 65536

cache:
  max_entries: 512

severity:
  low_max: 0.25
  medium_max: 0.60
  high_max: 0.90

enrichment:
  enabled_by_default: false
  include_external_by_default: false

history:
  top_shap_increasing: 5
  top_shap_decreasing: 3

alerts:
  enabled: true
  vendor: PhishingUrlAnalyzer
  product: URL Analysis Platform
  max_bytes: 5242880
  backup_count: 3

logging:
  file: app.log
  level: INFO
  max_bytes: 5242880
  backup_count: 3

virustotal:
  enabled: true
  base_url: https://www.virustotal.com/api/v3
  timeout_seconds: 8
  min_request_interval_seconds: 15
  note: >
    External intelligence cross-check, reported separately from the local
    ML verdict and never used for the classification decision. LOOKUP
    ONLY: URLs are never submitted to VirusTotal for scanning. Requires
    the VT_API_KEY environment variable; without it the feature reports
    'disabled' and the application works fully. Not ground truth.

dataset:
  random_seed: 42
  target_phishing: 5000
  target_legitimate: 5000
  benign_observed_frac: 0.5            # share of benign target from observed (sitemap) URLs
  max_urls_per_domain_malicious: 5
  max_urls_per_domain_benign: 25
  legitimate_domain_pool: 100000
  phishtank_csv: data/raw/phishtank.csv

# Phase 1R benign deep-URL source: public sitemaps of curated reputable
# organizations. We request ONLY robots.txt and the sitemap files it
# declares (bounded, polite); the page URLs inside are dataset strings
# and are NEVER visited. Per-source failures are reported, never hidden.
sitemaps:
  request_delay_seconds: 0.4
  max_file_mb: 20
  max_locs_per_file: 3000
  max_urls_per_domain: 200
  max_sitemap_files_per_domain: 3
  max_children_per_index: 15
  fallback_sitemap_paths: [sitemap.xml, sitemap_index.xml, sitemap-index.xml, sitemap.xml.gz]
